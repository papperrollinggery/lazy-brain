name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish as a dry run
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - name: Verify tag identity
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) process.exit(1)"
      - name: Pack verified distribution
        if: matrix.node-version == 24
        run: npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 24
        with:
          name: lazybrain-package
          path: lazybrain-*.tgz

  npm-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: lazybrain-package
          path: release-package
      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: npm publish release-package/*.tgz --dry-run
      - name: Publish verified package when registry credentials exist
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Registry publication skipped: no repository NPM_TOKEN is configured." >> "$GITHUB_STEP_SUMMARY"
            echo "The verified tarball remains available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish release-package/*.tgz --ignore-scripts
          echo "Registry publication completed." >> "$GITHUB_STEP_SUMMARY"
