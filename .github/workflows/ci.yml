name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    env:
      npm_config_fetch_retries: 5
      npm_config_fetch_retry_mintimeout: 20000
      npm_config_fetch_retry_maxtimeout: 120000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm test

      - name: Build
        run: |
          npm run build

      - name: CLI smoke
        run: |
          node dist/bin/lazybrain.js --version
          node dist/bin/lazybrain.js "review this PR for security"
          node dist/bin/lazybrain.js orchestrate "deploy payment feature"
          node dist/bin/lazybrain.js quickstart

      - name: Public package audit
        if: matrix.node == 20
        run: |
          npm run audit:public
          npm pack --dry-run --json
